- name: Provision containers and basic tooling
  hosts: local
  gather_facts: false

  tasks:
    - name: Ensure artifacts dir exists
      file:
        path: "{{ playbook_dir }}/../artifacts"
        state: directory
        mode: '0755'

    - name: Check if podman network exists
      command: podman network inspect cybernet
      register: network_check
      changed_when: false
      failed_when: false

    - name: Create podman network if not exists
      command: podman network create cybernet
      when: network_check.rc != 0
      changed_when: true

    - name: Check if dvwa container exists
      shell: podman ps -a --format "{% raw %}{{.Names}}{% endraw %}" --filter name=^dvwa$
      register: dvwa_check
      changed_when: false

    - name: Start dvwa (if not running)
      command: podman run -d --name dvwa --network cybernet -p 8080:80 vulnerables/web-dvwa:latest
      register: dvwa_run
      when: "'dvwa' not in dvwa_check.stdout"
      failed_when: false

    - name: Check if kali container exists
      shell: podman ps -a --format "{% raw %}{{.Names}}{% endraw %}" --filter name=^kali$
      register: kali_check
      changed_when: false

    - name: Start kali (if not running)
      command: podman run -itd --name kali --network cybernet --cap-add=NET_RAW --cap-add=NET_ADMIN kali-lab
      register: kali_run
      when: "'kali' not in kali_check.stdout"
      failed_when: false

    - name: Wait for DVWA to be up
      uri:
        url: http://localhost:8080
        status_code: 200
      register: dvwa_up
      retries: 10
      delay: 3
      failed_when: false
